# Капсула генетического сканера
- type: entity
  id: GeneticsScanner
  parent: BaseStructure
  name: Генетическая капсула
  description: Вмещает в себя пациента для считывания и изменения UI структуры генов.
  components:
  - type: GeneticsScanner
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      occupant: !type:ContainerSlider

# Консоль управления генетикой
- type: entity
  id: GeneticsConsole
  parent: BaseComputer
  name: Генетическая консоль управления
  description: Позволяет точечно рероллить 16-ричные значения Unique Identifiers.
  components:
  - type: UserInterface
    interfaces:
      - key: enum.Content.Shared._WorldDi.GeneticsConsoleUiKey.Key
        type: GeneticsConsoleBoundUserInterface

# Шприц-инжектор
- type: entity
  id: GeneticsInjector
  parent: BaseItem
  name: Генетический инжектор
  description: Медицинский шприц, содержащий сырую цепочку ДНК.
  components:
  - type: DNAInjector
  - type: Sprite
    sprite: Objects/Items/Medical/syringe.rsi
    state: icon

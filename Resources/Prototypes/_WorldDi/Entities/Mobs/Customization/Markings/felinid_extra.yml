# "Лисий хвост" from Dead Space (Soyuz) - the animated 10-frame wagging fox tail
# with three colourable layers. On МК it is sponsor-gated; here it is free.
- type: marking
  id: WDTailFoxWagStripes
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Felinid, Tajaran, Vulpkanin]
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:CategoryColoring
          category: FacialHair
        - !type:SkinColoring
  sprites:
  - sprite: _WorldDi/Mobs/Customization/fox_tail_wag.rsi
    state: tail_fox_wag_stripes_prime
  - sprite: _WorldDi/Mobs/Customization/fox_tail_wag.rsi
    state: tail_fox_wag_stripes_second
  - sprite: _WorldDi/Mobs/Customization/fox_tail_wag.rsi
    state: tail_fox_wag_stripes_third
